# Front statique donation-web (DF2) : nginx UBI non-root, port 8080, sans proxy (APISIX externe route /bff vers le BFF).
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    gzip          on;
    gzip_types    text/css application/javascript image/svg+xml;

    # Un evenement JSON par ligne sur stdout (Logs as Event Streams) ; traceparent pose par APISIX externe
    log_format json escape=json '{"@timestamp":"$time_iso8601","service.name":"donation-web",'
                                '"http.request.method":"$request_method","url.path":"$uri",'
                                '"http.response.status_code":$status,"http.response.body.bytes":$body_bytes_sent,'
                                '"event.duration_s":$request_time,"traceparent":"$http_traceparent"}';
    access_log /dev/stdout json;

    server {
        listen 8080 default_server;
        server_name _;
        root /opt/app-root/src;

        # Fichiers statiques : lecture seule
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Sonde (jamais routee par APISIX externe)
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # /bff appartient au BFF : jamais servi par le front, meme mal route
        location /bff/ {
            return 404;
        }

        # Fichiers a empreinte : cache un an (sans "always" : un 404 n'est jamais mis en cache)
        location /assets/ {
            include /etc/nginx/csp.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Routes de l'application (React Router) : index.html, jamais en cache (nouvelle version prise aussitot)
        location / {
            include /etc/nginx/csp.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.html;
        }
    }
}
