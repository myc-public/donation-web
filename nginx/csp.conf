# DF3 : CSP fixe, sans nonce ni 'unsafe-inline' (build Vite sans script ni style en ligne, verifie par check-dist.mjs).
# Bloquante depuis le passage Playwright en mode pile (15/10) : toute ressource hors liste est refusee par le navigateur.
# Les autres en-tetes de securite (HSTS, X-Content-Type-Options, Referrer-Policy...) sont poses par APISIX externe.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
